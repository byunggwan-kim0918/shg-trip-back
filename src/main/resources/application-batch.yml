# =============================================================================
# Batch Profile Configuration
# 배치 전용 프로필 (SPRING_PROFILES_ACTIVE=batch)
# ECS Fargate Scheduled Task로 실행 — CommandLineRunner 기반, @Scheduled 미사용
# =============================================================================

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/trip
    username: ${DB_USERNAME:weShg}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  # 스케줄링 최소화 — 배치는 CommandLineRunner로 실행
  task:
    scheduling:
      pool:
        size: 1

# --- Cookie 설정 (배치에서는 미사용이지만 Bean 생성 필요) ---
cookie:
  secure: false

# --- JWT 설정 (배치에서는 미사용이지만 Bean 생성 필요) ---
jwt:
  secret: batch_dummy_secret_key_not_used_in_batch_mode
  access-expiration: 1800000
  refresh-expiration: 604800000

# --- OAuth 설정 (배치에서는 미사용) ---
oauth:
  kakao:
    client-id: dummy
    client-secret: dummy
    token-uri: https://kauth.kakao.com/oauth/token
    user-info-uri: https://kapi.kakao.com/v2/user/me
    redirect-uri: http://localhost:3000/callback/kakao
  google:
    client-id: dummy
    client-secret: dummy
    token-uri: https://oauth2.googleapis.com/token
    user-info-uri: https://www.googleapis.com/oauth2/v2/userinfo
    redirect-uri: http://localhost:3000/callback/google
  naver:
    client-id: dummy
    client-secret: dummy
    token-uri: https://nid.naver.com/oauth2.0/token
    user-info-uri: https://openapi.naver.com/v1/nid/me
    redirect-uri: http://localhost:3000/callback/naver

# --- Anthropic API 설정 ---
anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
  models:
    haiku: claude-haiku-4-5-20251001
    sonnet: claude-sonnet-4-6
    max-output-tokens: 64000
  batch:
    # 장소 태그/설명/시간대 보강용 — 단순 구조화 생성이라 Haiku로 충분 (Batch API 50% 할인 병행)
    model: claude-haiku-4-5-20251001
    max-tokens-per-request: 1024
    poll-interval-ms: 10000
    max-poll-duration-ms: 3600000

# --- Google Places API 설정 (사전채움 배치가 사용) ---
google:
  places:
    api-key: ${GOOGLE_PLACES_API_KEY:}
    text-search-uri: https://places.googleapis.com/v1/places:searchText
    details-base-uri: https://places.googleapis.com/v1/places

# --- OpenAI API 설정 (임베딩 생성) ---
openai:
  api-key: ${OPENAI_API_KEY:}
  embedding-model: text-embedding-3-small
  embedding-dimensions: 1536

# --- 배치 작업 설정 ---
batch:
  foursquare:
    data-file-path: ${FOURSQUARE_DATA_PATH:data/foursquare-places.csv}
    chunk-size: 1000
    source: ${BATCH_FOURSQUARE_SOURCE:s3}
    # 우선 처리 도시 목록은 FoursquareSeeder.PRIORITY_CITIES 참조
  embedding:
    batch-size: 100
  enrich:
    chunk-size: 1000
    # LLM 보강 실행 여부 (기본 false — 초기엔 임베딩만 수행)
    # 프로덕션에서 보강이 필요할 때 BATCH_ENRICH_ENABLED=true로 설정
    enabled: ${BATCH_ENRICH_ENABLED:false}
    # 지역 스코프 (쉼표 구분, 예: "Jeju,Gangneung"). 비우면 전체 —
    # 전량 보강은 LLM 비용이 크므로 관광지 데이터가 빈약한 지역부터 점진 실행 권장.
    regions: ${BATCH_ENRICH_REGIONS:}
  tourapi:
    # 한국관광공사 TourAPI 관광지 시딩 (Foursquare의 빈약한 관광지 커버리지 보완)
    enabled: ${BATCH_TOURAPI_ENABLED:false}
    # data.go.kr 발급 서비스키 — URL 인코딩된 키를 그대로 입력
    service-key: ${TOUR_API_SERVICE_KEY:}
    # 시딩 대상 areaCode (쉼표 구분): 1=서울 2=인천 3=대전 4=대구 5=광주 6=부산 39=제주
    # 기본은 전국(region 매핑이 1:1인 광역시+제주 전체) — Foursquare처럼 매 배치마다 전 지역 반영
    area-codes: ${BATCH_TOURAPI_AREA_CODES:1,2,3,4,5,6,39}
    # areaCode×타입당 최대 수집 행 수
    max-rows-per-type: ${BATCH_TOURAPI_MAX_ROWS:500}
  google-sync:
    # Google Places 사전채움 실행 여부 (기본 false)
    enabled: ${BATCH_GOOGLE_SYNC_ENABLED:false}
    # 최근 N일 내 후보로 등장한 장소만 대상
    recent-days: ${BATCH_GOOGLE_SYNC_RECENT_DAYS:90}
    # 배치 1회 실행당 사전채움 상한 (Google 호출 폭주 방지)
    daily-limit: ${BATCH_GOOGLE_SYNC_DAILY_LIMIT:500}

# --- AWS S3 설정 (배치에서 Foursquare CSV 읽기) ---
cloud:
  aws:
    s3:
      region: ${AWS_REGION:ap-northeast-2}
      bucket: ${BATCH_FOURSQUARE_S3_BUCKET:shgtrip-data}

# --- 로깅 설정 (배치 모드) ---
logging:
  file:
    name: logs/shg-trip-batch.log
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 7
  level:
    "[com.shg.trip]": INFO
    "[com.shg.trip.shgtrip.domain.place.batch]": DEBUG
    "[org.springframework.boot]": INFO
