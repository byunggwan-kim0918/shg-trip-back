# =============================================================================
# Batch Profile Configuration
# 배치 전용 프로필 (SPRING_PROFILES_ACTIVE=batch)
# ECS Fargate Scheduled Task로 실행 — CommandLineRunner 기반, @Scheduled 미사용
# =============================================================================

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/trip
    username: ${DB_USERNAME:weShg}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  # 스케줄링 최소화 — 배치는 CommandLineRunner로 실행
  task:
    scheduling:
      pool:
        size: 1

# --- Cookie 설정 (배치에서는 미사용이지만 Bean 생성 필요) ---
cookie:
  secure: false

# --- JWT 설정 (배치에서는 미사용이지만 Bean 생성 필요) ---
jwt:
  secret: batch_dummy_secret_key_not_used_in_batch_mode
  access-expiration: 1800000
  refresh-expiration: 604800000

# --- OAuth 설정 (배치에서는 미사용) ---
oauth:
  kakao:
    client-id: dummy
    client-secret: dummy
    token-uri: https://kauth.kakao.com/oauth/token
    user-info-uri: https://kapi.kakao.com/v2/user/me
    redirect-uri: http://localhost:3000/callback/kakao
  google:
    client-id: dummy
    client-secret: dummy
    token-uri: https://oauth2.googleapis.com/token
    user-info-uri: https://www.googleapis.com/oauth2/v2/userinfo
    redirect-uri: http://localhost:3000/callback/google
  naver:
    client-id: dummy
    client-secret: dummy
    token-uri: https://nid.naver.com/oauth2.0/token
    user-info-uri: https://openapi.naver.com/v1/nid/me
    redirect-uri: http://localhost:3000/callback/naver

# --- Anthropic API 설정 ---
anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
  models:
    haiku: claude-haiku-5-5
    sonnet: claude-sonnet-5-5
    max-output-tokens: 64000
  batch:
    # 장소 태그/설명/시간대 보강용 — 단순 구조화 생성이라 Haiku로 충분 (Batch API 50% 할인 병행)
    model: claude-haiku-5-5
    max-tokens-per-request: 1024
    poll-interval-ms: 10000
    max-poll-duration-ms: 3600000

# --- Google Places API 설정 (사전채움 배치가 사용) ---

# --- OpenAI API 설정 (임베딩 생성) ---
openai:
  api-key: ${OPENAI_API_KEY:}
  embedding-model: text-embedding-3-small
  embedding-dimensions: 1536

# --- 배치 작업 설정 ---
batch:
  foursquare:
    data-file-path: ${FOURSQUARE_DATA_PATH:data/foursquare-places.csv}
    chunk-size: 1000
    source: ${BATCH_FOURSQUARE_SOURCE:s3}
    # 우선 처리 도시 목록은 FoursquareSeeder.PRIORITY_CITIES 참조
  embedding:
    batch-size: 100
    regions: ${BATCH_EMBEDDING_REGIONS:}   # 비우면 전 지역. 로컬 확인용으로 지역을 좁힐 때 (예: Jeju,Seoul,Busan)
  enrich:
    chunk-size: 1000
    # LLM 보강 실행 여부 (기본 false — 초기엔 임베딩만 수행)
    # 프로덕션에서 보강이 필요할 때 BATCH_ENRICH_ENABLED=true로 설정
    enabled: ${BATCH_ENRICH_ENABLED:false}
    # 지역 스코프 (쉼표 구분, 예: "Jeju,Gangneung"). 비우면 전체 —
    # 전량 보강은 LLM 비용이 크므로 관광지 데이터가 빈약한 지역부터 점진 실행 권장.
    regions: ${BATCH_ENRICH_REGIONS:}
    # 지역당 상한(0=무제한). 인기도 → 비식당 순으로 앞에서부터 자른다.
    max-per-region: ${BATCH_ENRICH_MAX_PER_REGION:0}
  role-backfill:
    # 카테고리로 확정되는 비방문 장소에 place_role=NOT_VISITABLE 기록(외부 호출 없음)
    enabled: ${BATCH_ROLE_BACKFILL_ENABLED:true}
  tourapi:
    # 한국관광공사 TourAPI 관광지 시딩 (Foursquare의 빈약한 관광지 커버리지 보완)
    enabled: ${BATCH_TOURAPI_ENABLED:false}
    # data.go.kr 발급 서비스키 — URL 인코딩된 키를 그대로 입력
    service-key: ${TOUR_API_SERVICE_KEY:}
    # 시딩 대상 (쉼표 구분): "areaCode" 또는 "areaCode-sigunguCode"
    #   1=서울 2=인천 3=대전 4=대구 5=광주 6=부산 39=제주
    #   31-13=수원 32-1=강릉 35-2=경주 37-12=전주 38-13=여수 (도 안의 도시는 시군구 코드로 좁힌다)
    # 토큰은 이 형식 그대로 받되, 조회는 법정동 코드(lDongRegnCd·lDongSignguCd)로 한다(TourApiSeeder.AREAS).
    # 지역코드로 조회하면 신규 레코드(areacode 공란)가 빠진다 — 제주 관광지 162 vs 557건(2026-10).
    # 광주만 법정동 데이터 이상으로 지역코드 조회를 유지한다.
    # 기본은 Foursquare 적재 대상 12개 도시 전부 — region이 같아야 벡터 검색 지역 필터에 함께 잡힌다
    area-codes: ${BATCH_TOURAPI_AREA_CODES:1,2,3,4,5,6,39,31-13,32-1,35-2,37-12,38-13}
    # 대상×타입당 최대 수집 행 수. 500이면 서울 음식점(816건)이 잘렸다(2026-10 실측).
    max-rows-per-type: ${BATCH_TOURAPI_MAX_ROWS:1000}
    image-backfill:
      # 이미지 없는 관광지를 이름으로 역조회해 채운다. 지역 목록(areaBasedList2)에 안 잡히는
      # 레코드가 있어서 필요하다 — TourAPI가 성산일출봉의 areacode를 빈 값으로 주는 탓에
      # areaCode=39 목록의 totalCount가 175로 고정이고 거기에 성산일출봉이 없다.
      # 대상 1건당 호출 1회라 기본은 꺼 둔다.
      enabled: ${BATCH_TOURAPI_IMAGE_BACKFILL:false}
      limit: ${BATCH_TOURAPI_IMAGE_BACKFILL_LIMIT:300}
  wikidata:
    enabled: ${BATCH_WIKIDATA_ENABLED:false}
    regions: ${BATCH_WIKIDATA_REGIONS:}          # 비우면 장소 수 기준 전 지역
    landmarks:
      # 지역 대표 명소(사찰·궁·박물관·해변·산 등, 언어판 min-sitelinks 이상)를 Wikidata에서 적재.
      # 기존 장소와 이름이 겹치고 2km 안이면 넣지 않는다(WikidataLandmarkSeeder).
      enabled: ${BATCH_WIKIDATA_LANDMARKS_ENABLED:false}
      min-sitelinks: ${BATCH_WIKIDATA_LANDMARKS_MIN_SITELINKS:5}

# --- AWS S3 설정 (배치에서 Foursquare CSV 읽기) ---
cloud:
  aws:
    s3:
      region: ${AWS_REGION:ap-northeast-2}
      bucket: ${BATCH_FOURSQUARE_S3_BUCKET:}   # 기본값 없음 — shgtrip-data는 타인 소유 버킷

# --- 로깅 설정 (배치 모드) ---
logging:
  file:
    name: logs/shg-trip-batch.log
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 7
  level:
    "[com.shg.trip]": INFO
    "[com.shg.trip.shgtrip.domain.place.batch]": DEBUG
    "[org.springframework.boot]": INFO
