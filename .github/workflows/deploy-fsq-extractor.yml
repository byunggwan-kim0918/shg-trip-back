name: Deploy FSQ Extractor

on:
  push:
    branches: [main]
    paths:
      - 'fsq-extractor/**'
  workflow_dispatch:

env:
  AWS_REGION: ap-northeast-2

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/shgtrip-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Build and push FSQ Extractor image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          FSQ_REPO: shgtrip-fsq-extractor
        run: |
          docker build -t fsq-extractor:latest ./fsq-extractor
          docker tag fsq-extractor:latest $ECR_REGISTRY/$FSQ_REPO:latest
          docker push $ECR_REGISTRY/$FSQ_REPO:latest
