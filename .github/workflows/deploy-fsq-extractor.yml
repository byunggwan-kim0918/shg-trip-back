name: Deploy FSQ Extractor

on:
  push:
    branches: [main]
    paths:
      - 'fsq-extractor/**'
  workflow_dispatch:

env:
  AWS_REGION: ap-northeast-2

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/shgtrip-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Build and push FSQ Extractor image
        id: build
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          FSQ_REPO: shgtrip-fsq-extractor
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t fsq-extractor:$IMAGE_TAG ./fsq-extractor
          docker tag fsq-extractor:$IMAGE_TAG $ECR_REGISTRY/$FSQ_REPO:$IMAGE_TAG
          docker tag fsq-extractor:$IMAGE_TAG $ECR_REGISTRY/$FSQ_REPO:latest
          docker push $ECR_REGISTRY/$FSQ_REPO:$IMAGE_TAG
          docker push $ECR_REGISTRY/$FSQ_REPO:latest
          echo "image=$ECR_REGISTRY/$FSQ_REPO:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition shgtrip-fsq-extractor \
            --query taskDefinition \
            > task-def.json

      - name: Render task definition with updated image
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@8d79160660ad39c402a16e5fc7cd2a32e8f7d6b7 # v1.9.1
        with:
          task-definition: task-def.json
          container-name: fsq-extractor
          image: ${{ steps.build.outputs.image }}

      - name: Register task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@a00d4d57ac0de1a99b39fe469f3d898d38717c2b # v2.6.4
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
