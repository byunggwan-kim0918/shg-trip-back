name: CI

on:
  pull_request:
    branches: [ main ]
  # setup-gradle은 main에서만 캐시를 저장하고 PR은 읽기만 한다.
  push:
    branches: [ main ]

jobs:
  # Job 1: 단위 테스트
  unit-test:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # services.gradle.org 배포판 다운로드가 러너에서 간헐적으로 끊긴다.
      - name: Download Gradle
        run: for i in 1 2 3; do ./gradlew --version --no-daemon -q && exit 0; sleep 15; done; exit 1

      - name: Compile
        run: ./gradlew compileJava compileTestJava --no-daemon

      - name: Run unit tests
        run: ./gradlew test --no-daemon
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: Generate coverage report
        run: ./gradlew jacocoTestReport --no-daemon

      - name: Publish test results
        uses: dorny/test-reporter@3eeb9fc888e82e8be2fb356bbeec2750231672bc # v1
        if: always()
        with:
          name: Unit Test Results
          path: build/test-results/test/*.xml
          reporter: java-junit
          fail-on-error: true

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/html/

  # FSQ 추출기 규칙 테스트 (합성 테이블, 외부 호출 없음)
  extractor-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # 러너의 시스템 Python은 pip 직접 설치를 막는다(PEP 668).
      - name: Run extractor tests
        working-directory: fsq-extractor
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q -r requirements.txt pytest
          .venv/bin/python -m pytest -q test_extract.py

  # Job 2: 통합 테스트 (DB/Redis service container)
  integration-test:
    needs: unit-test
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_DB: shgtrip
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Download Gradle
        run: for i in 1 2 3; do ./gradlew --version --no-daemon -q && exit 0; sleep 15; done; exit 1

      - name: Run integration tests
        run: ./gradlew integrationTest --no-daemon
        env:
          SPRING_PROFILES_ACTIVE: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: postgres
          DB_PASSWORD: testpassword123
          DB_NAME: shgtrip
          REDIS_HOST: localhost
          REDIS_PORT: 6379

      - name: Build check
        run: ./gradlew build -x test --no-daemon

      - name: Publish test results
        uses: dorny/test-reporter@3eeb9fc888e82e8be2fb356bbeec2750231672bc # v1
        if: always()
        with:
          name: Integration Test Results
          path: build/test-results/integrationTest/*.xml
          reporter: java-junit
          fail-on-error: true
